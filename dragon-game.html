<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slay the Fire Dragon!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .screen {
            display: none;
            width: 100%;
            max-width: 1920px;
            height: 100vh;
            max-height: 1080px;
            position: relative;
            animation: fadeIn 0.5s ease-in;
        }

        .screen.active {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .title {
            font-size: 80px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 100px;
            color: #2c3e50;
            text-shadow: 3px 3px 0px rgba(0,0,0,0.1);
            letter-spacing: 2px;
        }

        .mission-title {
            font-size: 64px;
            font-weight: bold;
            position: absolute;
            top: 50px;
            left: 60px;
            color: #2c3e50;
        }

        button {
            background: white;
            border: 4px solid #34495e;
            border-radius: 8px;
            padding: 25px 80px;
            font-size: 48px;
            font-family: 'Courier New', monospace;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
            background: #ecf0f1;
        }

        button:active {
            transform: scale(0.98);
        }

        .choices {
            display: flex;
            gap: 400px;
            align-items: center;
            justify-content: center;
            width: 100%;
            margin-top: 150px;
        }

        .choice {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .choice:hover {
            transform: scale(1.1);
        }

        .choice-icon {
            width: 200px;
            height: 250px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .choice-label {
            font-size: 48px;
            font-weight: bold;
            color: #2c3e50;
        }

        .stick-figure {
            position: absolute;
            left: 300px;
            top: 50%;
            transform: translateY(-50%);
        }

        .stick-head {
            width: 60px;
            height: 60px;
            border: 5px solid black;
            border-radius: 50%;
            background: white;
        }

        .stick-body {
            width: 5px;
            height: 120px;
            background: black;
            margin: 0 auto;
        }

        .stick-arms {
            width: 80px;
            height: 5px;
            background: black;
            margin: -60px auto 0;
        }

        .stick-legs {
            display: flex;
            justify-content: space-between;
            width: 60px;
            margin: 0 auto;
        }

        .stick-leg {
            width: 5px;
            height: 100px;
            background: black;
            transform-origin: top;
        }

        .stick-leg.left {
            transform: rotate(-20deg);
        }

        .stick-leg.right {
            transform: rotate(20deg);
        }

        /* Weapon icons */
        .sword-icon {
            width: 80px;
            height: 180px;
            position: relative;
        }

        .sword-blade {
            width: 20px;
            height: 140px;
            background: linear-gradient(to right, #c0c0c0, #e0e0e0);
            margin: 0 auto;
            border-radius: 3px 3px 0 0;
            box-shadow: inset 2px 0 5px rgba(0,0,0,0.2);
        }

        .sword-handle {
            width: 50px;
            height: 15px;
            background: #8b4513;
            margin: 0 auto;
            border-radius: 3px;
        }

        .sword-guard {
            width: 70px;
            height: 8px;
            background: #daa520;
            margin: 5px auto;
        }

        .bow-icon {
            width: 120px;
            height: 180px;
            position: relative;
        }

        .bow-curve {
            width: 80px;
            height: 150px;
            border: 5px solid #8b4513;
            border-right: none;
            border-radius: 50% 0 0 50%;
            margin: 0 auto;
        }

        .bow-string {
            position: absolute;
            right: 20px;
            top: 10px;
            height: 130px;
            width: 2px;
            background: #666;
        }

        .mop-icon {
            width: 120px;
            height: 200px;
            position: relative;
        }

        .mop-handle {
            width: 8px;
            height: 150px;
            background: #8b4513;
            margin: 0 auto;
            border-radius: 4px;
        }

        .mop-head {
            width: 100px;
            height: 50px;
            background: linear-gradient(to bottom, #87ceeb, #4682b4);
            margin: 5px auto;
            border-radius: 50%;
            position: relative;
        }

        .mop-head::after {
            content: '';
            position: absolute;
            bottom: -20px;
            left: 0;
            width: 100%;
            height: 20px;
            background: linear-gradient(to bottom, rgba(135, 206, 235, 0.7), transparent);
        }

        .soaker-icon {
            width: 180px;
            height: 120px;
            position: relative;
        }

        .soaker-body {
            width: 120px;
            height: 60px;
            background: linear-gradient(135deg, #ff6b9d, #c44569);
            border-radius: 30px;
            position: relative;
        }

        .soaker-nozzle {
            width: 60px;
            height: 20px;
            background: linear-gradient(to right, #c44569, #8b3a62);
            position: absolute;
            right: -50px;
            top: 20px;
            border-radius: 0 10px 10px 0;
        }

        .soaker-handle {
            width: 40px;
            height: 40px;
            border: 5px solid #c44569;
            border-radius: 0 0 20px 20px;
            border-top: none;
            position: absolute;
            bottom: -35px;
            left: 40px;
        }

        .dragon {
            width: 700px;
            height: 500px;
            background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500"><rect fill="%2334a853" width="700" height="500" rx="50"/><ellipse cx="350" cy="200" rx="200" ry="150" fill="%2387ceeb" opacity="0.3"/><circle cx="300" cy="180" r="30" fill="black"/><circle cx="310" cy="180" r="10" fill="white"/><path d="M 200 300 Q 350 350 500 300" stroke="%23333" stroke-width="5" fill="none"/></svg>');
            background-size: cover;
            position: absolute;
            right: 150px;
            top: 200px;
            border-radius: 50px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .dragon-fire {
            position: absolute;
            right: 200px;
            top: 250px;
            font-size: 100px;
            animation: flicker 0.5s infinite;
        }

        @keyframes flicker {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.1); }
        }

        .attacks-container {
            position: absolute;
            left: 180px;
            top: 250px;
            display: flex;
            flex-direction: column;
            gap: 40px;
        }

        .attack-btn {
            padding: 20px 50px;
            font-size: 36px;
            min-width: 350px;
        }

        .result-screen {
            text-align: center;
        }

        .result-title {
            font-size: 100px;
            margin-bottom: 100px;
            font-weight: bold;
        }

        .win .result-title {
            color: #27ae60;
            text-shadow: 3px 3px 0px rgba(39, 174, 96, 0.3);
        }

        .lose .result-title {
            color: #e74c3c;
            text-shadow: 3px 3px 0px rgba(231, 76, 60, 0.3);
        }

        .ashes {
            width: 200px;
            height: 80px;
            background: #7f8c8d;
            border-radius: 50%;
            position: relative;
            margin: 50px auto;
            box-shadow: inset 0 5px 15px rgba(0,0,0,0.5);
        }

        .ashes::before {
            content: '💀';
            font-size: 60px;
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
        }

        .battle-animation {
            position: absolute;
            font-size: 80px;
            animation: attackMove 1s ease-out;
        }

        @keyframes attackMove {
            0% { left: 300px; opacity: 0; }
            50% { opacity: 1; }
            100% { left: 800px; opacity: 0; }
        }

        @keyframes dragonShake {
            0%, 100% { transform: translate(0, 0); }
            25% { transform: translate(-10px, -10px); }
            75% { transform: translate(10px, 10px); }
        }

        .dragon.hit {
            animation: dragonShake 0.3s;
        }

        .mission-btn-container {
            position: absolute;
            bottom: 300px;
            left: 50%;
            transform: translateX(-50%);
        }

        /* Weapon display on fight screen */
        .player-weapon {
            position: absolute;
            left: 400px;
            top: 500px;
        }
    </style>
</head>
<body>
    <!-- Start Screen -->
    <div class="screen active" id="start-screen">
        <div class="title">slay the fire dragon!</div>
        <button onclick="goToScreen('choose-class')">start</button>
    </div>

    <!-- Choose Class Screen -->
    <div class="screen" id="choose-class">
        <div class="mission-title">1) Choose your class</div>
        <div class="stick-figure">
            <div class="stick-head"></div>
            <div class="stick-body"></div>
            <div class="stick-arms"></div>
            <div class="stick-legs">
                <div class="stick-leg left"></div>
                <div class="stick-leg right"></div>
            </div>
        </div>
        <div class="choices">
            <div class="choice" onclick="chooseClass('melee')">
                <div class="choice-icon">
                    <div class="sword-icon">
                        <div class="sword-blade"></div>
                        <div class="sword-guard"></div>
                        <div class="sword-handle"></div>
                    </div>
                </div>
                <div class="choice-label">melee</div>
            </div>
            <div class="choice" onclick="chooseClass('ranger')">
                <div class="choice-icon">
                    <div class="bow-icon">
                        <div class="bow-curve"></div>
                        <div class="bow-string"></div>
                    </div>
                </div>
                <div class="choice-label">ranger</div>
            </div>
        </div>
    </div>

    <!-- Choose Weapon - Melee -->
    <div class="screen" id="choose-weapon-melee">
        <div class="mission-title">2) Choose your weapon</div>
        <div class="choices">
            <div class="choice" onclick="chooseWeapon('sword')">
                <div class="choice-icon">
                    <div class="sword-icon">
                        <div class="sword-blade"></div>
                        <div class="sword-guard"></div>
                        <div class="sword-handle"></div>
                    </div>
                </div>
                <div class="choice-label">sword</div>
            </div>
            <div class="choice" onclick="chooseWeapon('wet-mop')">
                <div class="choice-icon">
                    <div class="mop-icon">
                        <div class="mop-handle"></div>
                        <div class="mop-head"></div>
                    </div>
                </div>
                <div class="choice-label">wet mop</div>
            </div>
        </div>
    </div>

    <!-- Choose Weapon - Ranger -->
    <div class="screen" id="choose-weapon-ranger">
        <div class="mission-title">2) Choose your weapon</div>
        <div class="choices">
            <div class="choice" onclick="chooseWeapon('super-soaker')">
                <div class="choice-icon">
                    <div class="soaker-icon">
                        <div class="soaker-body"></div>
                        <div class="soaker-nozzle"></div>
                        <div class="soaker-handle"></div>
                    </div>
                </div>
                <div class="choice-label">super soaker</div>
            </div>
            <div class="choice" onclick="chooseWeapon('bow')">
                <div class="choice-icon">
                    <div class="bow-icon">
                        <div class="bow-curve"></div>
                        <div class="bow-string"></div>
                    </div>
                </div>
                <div class="choice-label">bow</div>
            </div>
        </div>
    </div>

    <!-- Before Dragon Fight -->
    <div class="screen" id="before-fight">
        <div class="mission-title">mission 3</div>
        <div class="mission-btn-container">
            <button onclick="startFight()">lets gooooooo!!!!</button>
        </div>
    </div>

    <!-- Dragon Fight -->
    <div class="screen" id="dragon-fight">
        <div class="dragon" id="dragon"></div>
        <div class="dragon-fire">🔥</div>
        <div class="stick-figure">
            <div class="stick-head"></div>
            <div class="stick-body"></div>
            <div class="stick-arms"></div>
            <div class="stick-legs">
                <div class="stick-leg left"></div>
                <div class="stick-leg right"></div>
            </div>
        </div>
        <div class="attacks-container" id="attacks-container"></div>
    </div>

    <!-- Win Screen -->
    <div class="screen result-screen win" id="win-screen">
        <div class="result-title">you win!</div>
        <div class="stick-figure">
            <div class="stick-head"></div>
            <div class="stick-body"></div>
            <div class="stick-arms"></div>
            <div class="stick-legs">
                <div class="stick-leg left"></div>
                <div class="stick-leg right"></div>
            </div>
        </div>
        <button onclick="restartGame()" style="margin-top: 100px;">play again</button>
    </div>

    <!-- Lose Screen -->
    <div class="screen result-screen lose" id="lose-screen">
        <div class="result-title">you lose</div>
        <div class="ashes"></div>
        <button onclick="restartGame()" style="margin-top: 50px;">try again</button>
    </div>

    <script>
        let gameState = {
            class: null,
            weapon: null,
            dragonHealth: 3,
            playerHealth: 3
        };

        function goToScreen(screenId) {
            document.querySelectorAll('.screen').forEach(screen => {
                screen.classList.remove('active');
            });
            document.getElementById(screenId).classList.add('active');
        }

        function chooseClass(classType) {
            gameState.class = classType;
            if (classType === 'melee') {
                goToScreen('choose-weapon-melee');
            } else {
                goToScreen('choose-weapon-ranger');
            }
        }

        function chooseWeapon(weapon) {
            gameState.weapon = weapon;
            goToScreen('before-fight');
        }

        function startFight() {
            setupFightScreen();
            goToScreen('dragon-fight');
        }

        function setupFightScreen() {
            const container = document.getElementById('attacks-container');
            container.innerHTML = '';

            if (gameState.class === 'melee') {
                if (gameState.weapon === 'sword') {
                    container.innerHTML = `
                        <button class="attack-btn" onclick="attack('sword-strike')">sword strike</button>
                        <button class="attack-btn" onclick="attack('hungry')">im hungry</button>
                    `;
                } else {
                    container.innerHTML = `
                        <button class="attack-btn" onclick="attack('mop-whack')">mop whack</button>
                        <button class="attack-btn" onclick="attack('clean-floor')">cleaning the floor</button>
                    `;
                }
            } else {
                if (gameState.weapon === 'bow') {
                    container.innerHTML = `
                        <button class="attack-btn" onclick="attack('arrow-strike')">arrow strike</button>
                        <button class="attack-btn" onclick="attack('melee-mode')">melee mode</button>
                    `;
                } else {
                    container.innerHTML = `
                        <button class="attack-btn" onclick="attack('pew-pew')">pew pew</button>
                        <button class="attack-btn" onclick="attack('boomerang')">it looks like a boomerang</button>
                    `;
                }
            }
        }

        function attack(attackType) {
            // Determine if attack hits
            const goodAttacks = ['sword-strike', 'mop-whack', 'arrow-strike', 'pew-pew'];
            const isGoodAttack = goodAttacks.includes(attackType);

            if (isGoodAttack) {
                gameState.dragonHealth--;
                showAttackAnimation('💥');
                shakeDragon();
            } else {
                gameState.playerHealth--;
                showAttackAnimation('💔');
            }

            setTimeout(() => {
                if (gameState.dragonHealth <= 0) {
                    goToScreen('win-screen');
                } else if (gameState.playerHealth <= 0) {
                    goToScreen('lose-screen');
                }
            }, 1000);
        }

        function showAttackAnimation(emoji) {
            const animation = document.createElement('div');
            animation.className = 'battle-animation';
            animation.textContent = emoji;
            document.getElementById('dragon-fight').appendChild(animation);
            
            setTimeout(() => {
                animation.remove();
            }, 1000);
        }

        function shakeDragon() {
            const dragon = document.getElementById('dragon');
            dragon.classList.add('hit');
            setTimeout(() => {
                dragon.classList.remove('hit');
            }, 300);
        }

        function restartGame() {
            gameState = {
                class: null,
                weapon: null,
                dragonHealth: 3,
                playerHealth: 3
            };
            goToScreen('start-screen');
        }
    </script>
</body>
</html>
